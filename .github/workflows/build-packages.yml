name: Build OpenWrt package

# Desativado gatilho automatico de push por tag (Regra 12: geracao local e canonica e leva 2s)
# Permite apenas disparo manual se necessario via interface web do GitHub
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and IPK packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host tools and minify assets
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          npm install -g esbuild
          python3 scripts/build_minified_assets.py

      - name: Build APK and IPK packages
        shell: bash
        env:
          SRC_DIR: ${{ github.workspace }}
          WORK_ROOT: ${{ github.workspace }}/.openwrt-build
          SDK_LINK: ${{ github.workspace }}/.openwrt-sdk-filogic
        run: |
          rm -rf dist/sdk release-artifacts
          mkdir -p dist/sdk release-artifacts
          chmod +x scripts/build-apk-wsl.sh scripts/build-apk-manual-wsl.sh scripts/build-ipk-wsl.sh
          scripts/build-apk-wsl.sh
          python3 scripts/build-ipk-mac.py

      - name: Collect package artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          if ! find dist/sdk -type f -name 'luci-app-ark-router*.apk' | grep -q .; then
            echo "ARK Router package artifact was not found." >&2
            find dist -type f -print >&2 || true
            exit 1
          fi
          cp dist/sdk/luci-app-ark-router*.apk release-artifacts/
          cp dist/sdk/luci-app-ark-router*.ipk release-artifacts/ 2>/dev/null || true
          ls -lh release-artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ark-router-openwrt-apk
          path: release-artifacts/*
          if-no-files-found: error
