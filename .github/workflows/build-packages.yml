name: Build OpenWrt package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build APK package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build APK with OpenWrt SDK packaging tool
        shell: bash
        env:
          SRC_DIR: ${{ github.workspace }}
          WORK_ROOT: ${{ github.workspace }}/.openwrt-build
          SDK_LINK: ${{ github.workspace }}/.openwrt-sdk-filogic
        run: |
          chmod +x scripts/build-apk-wsl.sh scripts/build-apk-manual-wsl.sh
          scripts/build-apk-wsl.sh

      - name: Collect package artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          if ! find dist/sdk -type f -name 'luci-app-ark-router*.apk' | grep -q .; then
            echo "ARK Router package artifact was not found." >&2
            find dist -type f -print >&2 || true
            exit 1
          fi
          cp dist/sdk/luci-app-ark-router*.apk release-artifacts/
          ls -lh release-artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ark-router-openwrt-apk
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
