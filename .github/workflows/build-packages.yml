name: Build OpenWrt package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            artifact_name: openwrt-aarch64-cortex-a53

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare OpenWrt feed layout
        shell: bash
        run: |
          mkdir -p .openwrt-feed/luci-app-ark-router
          rsync -a \
            --exclude '.git' \
            --exclude '.openwrt-feed' \
            ./ .openwrt-feed/luci-app-ark-router/

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGES: luci-app-ark-router
          FEED_DIR: ${{ github.workspace }}/.openwrt-feed
          V: s

      - name: Collect package artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          find bin/packages -type f \( -name '*.apk' -o -name '*.ipk' \) -print -exec cp {} release-artifacts/ \;
          first_apk="$(find bin/packages -type f -name '*.apk' | head -n1 || true)"
          first_ipk="$(find bin/packages -type f -name '*.ipk' | head -n1 || true)"
          if [ -n "$first_apk" ]; then
            cp "$first_apk" release-artifacts/luci-app-ark-router.apk
          fi
          if [ -n "$first_ipk" ]; then
            cp "$first_ipk" release-artifacts/luci-app-ark-router.ipk
          fi
          if [ -f logs/package/luci-app-ark-router/compile.txt ]; then
            cp logs/package/luci-app-ark-router/compile.txt "release-artifacts/build-log-${{ matrix.artifact_name }}.txt"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ark-router-${{ matrix.artifact_name }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
