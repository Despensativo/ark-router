name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check LuCI JavaScript syntax
        run: node --check root/www/luci-static/resources/view/equipe-dashboard/overview.js
