name: Lint

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-checks:
    name: Deterministic Lint, Contracts & Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check LuCI & modular JavaScript syntax
        run: |
          for f in src/core/*.js src/modules/*.js \
            root/www/luci-static/resources/view/equipe-dashboard/overview.js \
            root/www/luci-static/ark/ark-theme.js \
            root/www/luci-static/ark/ark-guides.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done

      - name: Verify frontend bundle synchronization
        run: python3 scripts/build_frontend_bundle.py --check

      - name: Run shell, RPC, firewall and OpenWrt compliance audit
        run: python3 scripts/audit_shell_scripts.py

      - name: Run JS and documentation unit tests
        run: |
          node tests/test_ui_capability_sync.cjs
          node tests/test_card_accordions.mjs
          python3 tests/test_feature_remove_failures.py
          python3 tests/test_audit_documentation.py
          python3 tests/test_audit_wave1_wave2.py
          python3 tests/test_audit_wave3.py
          python3 tests/test_offline_review.py

      - name: Verify feature contracts, state preservation, i18n, docs and CODE_MAP
        run: |
          python3 tests/verify_feature_contracts.py
          python3 scripts/audit_state_preservation.py --strict
          python3 scripts/audit_i18n.py --strict
          python3 scripts/audit_docs.py --strict
          python3 scripts/generate_code_map.py --check

      - name: Check Ralph Loop, offline reviewer and Git hooks (POSIX sh)
        run: shellcheck -s sh scripts/ralph-loop.sh scripts/offline-review.sh .githooks/pre-commit .githooks/pre-push

  shellcheck-audit:
    name: ShellCheck Audit (PR Gate & Baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Gate changed shell scripts in Pull Request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          sh_files=()
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sh|*.qos) sh_files+=("$f") ;;
              *)
                first_line=$(head -n 1 "$f" 2>/dev/null || true)
                if [[ "$first_line" == "#!/"*sh* ]]; then
                  sh_files+=("$f")
                fi
                ;;
            esac
          done < <(git diff -z --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}...${{ github.sha }}")

          if [ "${#sh_files[@]}" -eq 0 ]; then
            echo "No shell files changed in this PR."
            exit 0
          fi

          echo "Checking changed shell files (${#sh_files[@]}):"
          printf '  %s\n' "${sh_files[@]}"
          shellcheck -s sh -S error "${sh_files[@]}"

      - name: Baseline ShellCheck error scan on root/
        shell: bash
        run: |
          sh_files=()
          while IFS= read -r -d '' f; do
            case "$f" in
              *.sh|*.qos) sh_files+=("$f") ;;
              *.js|*.css|*.py|*.md|*.json|*.ut|*.htm|*.lua|*.html|*.png|*.svg|*.nft) ;;
              *)
                first_line=$(head -n 1 "$f" 2>/dev/null || true)
                if [[ "$first_line" == "#!/"*sh* ]]; then
                  sh_files+=("$f")
                fi
                ;;
            esac
          done < <(find root -type f -print0 | sort -z)

          set +e
          out=$(shellcheck -s sh -S error -f gcc "${sh_files[@]}" 2>&1)
          rc=$?
          set -e

          err_count=0
          if [ -n "$out" ]; then
            echo "$out"
            err_count=$(printf '%s\n' "$out" | grep -c ': error:' || true)
          fi

          {
            echo "### ShellCheck Baseline (\`root/\`)"
            echo ""
            echo "- Arquivos shell verificados: \`${#sh_files[@]}\`"
            echo "- Erros (\`-S error\`): \`${err_count}\`"
            echo "- Rastreamento e plano de correção: \`docs/AUDIT_REPORT.md\` (\`AUD-004\`, \`AUD-008\`)"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$rc"
