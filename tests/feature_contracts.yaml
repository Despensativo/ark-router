metadata:
  version: 1.5.2
  schema_version: '1.0'
  total_features: 70
  canonical_repo: C:/Users/User/Desktop/FEITOS COM IA/Ark-Router/GitHub/luci-app-ark-router
features:
- id: ARK-UI-001
  name: Painel LuCI Overview e Telemetria em Tempo Real
  purpose: Apresentar visualização unificada de interfaces WAN/LAN, Wi-Fi, clientes conectados, métricas de tráfego e diagnósticos
    em Vanilla JS com atualização assíncrona ubus.
  state: funcional
  files:
  - src/core/rpc.js
  - src/modules/render.js
  - src/modules/lifecycle.js
  - root/www/luci-static/resources/view/equipe-dashboard/overview.js
  actions:
  - overview.js render()
  - rpc.js poll()
  rpc_endpoints:
  - network.interface/dump
  - network.device/status
  - system/info
  - system/board
  - luci-rpc/getDHCPLeases
  - iwinfo/assoclist
  acls:
  - luci-app-equipe-dashboard
  dependencies:
  - luci-mod-admin-full
  - rpcd
  - rpcd-mod-luci
  uci_configs:
  - package: equipe_dashboard
    sections:
    - main
    - feature
  services:
  - uhttpd
  - rpcd
  persistent_data:
  - /etc/config/equipe_dashboard
  temp_data:
  - /tmp/luci-indexcache
  - /tmp/luci-modulecache/
  boot_behavior: Carregado sob demanda via navegador na porta 80/443; polling ubus a cada 3 a 5 segundos.
  can_modify:
  - DOM LuCI
  - configurações cosméticas equipe_dashboard.main
  cannot_modify:
  - regras de firewall arbitrárias
  - arquivos fora de /etc/config/equipe_dashboard
  relations:
  - ARK-UI-002
  - ARK-UI-003
  - ARK-HIST-001
  - ARK-DIAG-001
  hw_limitations: Execução leve no cliente (<60 KB transferidos, zero runtime npm), compatível com navegadores móveis e desktop.
  openwrt_limitations: Dual OpenWrt 19.07 a 25.x (LuCI client-side JavaScript view L.view.extend).
  profiles:
  - lite
  - full
  version: 1.5.2
  tests:
  - tests/test_wan_matrix.py
  - scripts/verify_dom_progressive.mjs
  real_hw_required: false
- id: ARK-UI-002
