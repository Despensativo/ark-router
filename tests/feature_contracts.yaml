- id: ARK-WAN-009
  name: TCP Turbo — Otimização de Buffers e BBR/Cubic do Kernel
  purpose: Ajustar tamanhos de janelas TCP rmem/wmem, qdisc fq e tcp_congestion_control para atingir vazão máxima em enlaces
    de alta velocidade e fibra gigabit.
  state: funcional
  files:
  - root/usr/lib/ark/modules/network.sh
  actions:
  - wan-optimize-set tcp_turbo=1
  - wan-optimize-set tcp_turbo=0
  rpc_endpoints:
  - /usr/sbin/equipe-dashboard-control wan-optimize-set
  acls:
  - luci-app-equipe-dashboard
  dependencies:
  - sysctl
  uci_configs:
  - package: equipe_dashboard
    sections:
    - wan_optimize
  services: []
  persistent_data:
  - /etc/sysctl.d/99-ark-tcp-turbo.conf
  - /etc/config/equipe_dashboard
  temp_data:
  - /proc/sys/net/ipv4/tcp_*
  - /proc/sys/net/core/*
  boot_behavior: Arquivo /etc/sysctl.d/99-ark-tcp-turbo.conf é aplicado pelo procd no boot.
  can_modify:
  - /etc/sysctl.d/99-ark-tcp-turbo.conf
