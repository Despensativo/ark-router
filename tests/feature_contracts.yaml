  - root/www/luci-static/ark/cascade.css
  - root/www/luci-static/ark/mobile.css
  - root/usr/share/ucode/luci/template/themes/ark/header.ut
  - root/usr/lib/lua/luci/view/themes/ark/header.htm
  actions:
  - ark-theme.js init()
  - theme
  rpc_endpoints:
  - uci/get
  - uci/set
  acls:
  - luci-app-equipe-dashboard
  dependencies:
  - luci-base
  uci_configs:
  - package: luci
    sections:
    - themes
    - main
  services:
  - uhttpd
  persistent_data:
  - /etc/config/luci
  temp_data:
  - /tmp/luci-indexcache
  boot_behavior: Restaurado no boot via 99-ark-router-theme e ark-firewall-guard preservando personalização do usuário.
  can_modify:
  - luci.main.mediaurlbase
  - luci.themes.ARK
  cannot_modify:
  - configurações de rede
  - firewall
  - switches
  relations:
  - ARK-UI-001
  - ARK-UI-003
  hw_limitations: Orçamento estrito < 60 KB CSS+JS compactado para dispositivos com 16 MB SPI Flash.
  openwrt_limitations: Compatível com ucode (24.x+) e Lua (19.07 a 23.05).
  profiles:
  - lite
  - full
  version: 1.5.2
  tests:
