- id: ARK-WAN-003
  name: Otimização Baby Jumbo Frames (MTU 1508 / MRU 1500)
  purpose: Habilitar MTU 1508 na interface física pai para permitir PPPoE sem fragmentação com MTU 1500 limpo (Baby Jumbo).
  state: funcional
  files:
  - root/usr/lib/ark/modules/network.sh
  - root/usr/lib/ark/modules/doctor.sh
  actions:
  - wan-optimize-set baby_jumbo=1
  - wan-optimize-status
  rpc_endpoints:
  - /usr/sbin/equipe-dashboard-control wan-optimize-*
  acls:
  - luci-app-equipe-dashboard
  dependencies:
  - ip-full
  - netifd
  uci_configs:
  - package: network
    sections:
    - device
    - wan
  services:
  - network
  persistent_data:
  - /etc/config/network
  temp_data:
  - /sys/class/net/*/mtu
  boot_behavior: Gravado na seção config device do network; netifd aplica MTU 1508 antes de levantar a sessão PPPoE.
  can_modify:
  - network.@device[].mtu
  - network.wan.mtu
  cannot_modify:
  - network.lan
  - interfaces sem suporte a MTU expandido
  relations:
  - ARK-WAN-001
  - ARK-WAN-002
  - ARK-DIAG-001
  hw_limitations: Exige hardware de rede com suporte a frames de 1508 bytes no driver Ethernet (MTK, Atheros Gigabit).
  openwrt_limitations: Universal em OpenWrt com DSA ou swconfig moderno.
  profiles:
  - lite
  - full
  version: 1.5.2
  tests:
