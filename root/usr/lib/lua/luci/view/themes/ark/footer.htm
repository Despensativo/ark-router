<% local ver = require "luci.version" %>

   <footer class="ark-footer">
    <div class="ark-footer-wrap">
     <span>ARK Router OS &bull; LuCI <%= ver.distversion or "" %></span>
     <ul class="breadcrumb pull-right" id="modemenu" style="display:none"></ul>
    </div>
   </footer>
  </div>
  <% if luci.dispatcher.context.authsession then %>
  <script type="text/javascript">
    L.require('menu-bootstrap');
    (function() {
      document.addEventListener('click', function(e) {
        var menuLink = e.target.closest('#topmenu li.dropdown > a.menu');
        if (menuLink) {
          e.preventDefault();
          e.stopPropagation();
          var parentLi = menuLink.parentElement;
          var wasOpen = parentLi.classList.contains('open');
          document.querySelectorAll('#topmenu li.dropdown').forEach(function(li) {
            li.classList.remove('open');
          });
          if (!wasOpen) {
            parentLi.classList.add('open');
          }
          return;
        }
        if (e.target.closest('#topmenu .dropdown-menu a')) {
          return;
        }
        document.querySelectorAll('#topmenu li.dropdown.open').forEach(function(li) {
          li.classList.remove('open');
        });
      });
      document.addEventListener('keydown', function(ev) {
        if (ev.key === 'Escape' || ev.keyCode === 27) {
          var modal = document.querySelector('.modal, .cbi-modal, #modal_overlay, div[class*="modal"]');
          if (modal) {
            ev.preventDefault();
            if (window.L && L.ui && typeof L.ui.hideModal === 'function') {
              L.ui.hideModal();
            } else {
              var btn = modal.querySelector('button.cbi-button-neutral, button.btn-neutral, .close');
              if (btn) btn.click();
            }
          }
        }
      });
    })();
  </script>
  <% end %>
 </body>
</html>
