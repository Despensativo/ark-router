<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="WAN and SQM controls preview">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#f8fafc;font-size:42px;font-weight:800}.sub{fill:#9ca3af;font-size:20px}.card{fill:#111827;stroke:#26334d;stroke-width:1.5}.label{fill:#e5e7eb;font-size:24px;font-weight:800}.small{fill:#94a3b8;font-size:17px}.field{fill:#0b1120;stroke:#334155}.btn{fill:url(#g)}.num{fill:#f8fafc;font-size:34px;font-weight:800}
    </style>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="86" y="92" class="title">Controles rápidos de Internet</text>
  <text x="86" y="128" class="sub">Editar WAN, porta física, DNS e limites SQM sem sair da tela inicial</text>

  <rect x="86" y="172" width="520" height="454" rx="30" class="card"/>
  <text x="124" y="228" class="label">Editar WAN2</text>
  <text x="124" y="274" class="small">Função da porta</text>
  <rect x="124" y="292" width="390" height="46" rx="14" class="field"/><text x="148" y="322" fill="#e5e7eb" font-size="18">Usar LAN1 como internet / WAN2</text>
  <text x="124" y="374" class="small">Protocolo</text>
  <rect x="124" y="392" width="120" height="44" rx="22" fill="#0ea5e9"/><text x="160" y="420" fill="#fff" font-size="17" font-weight="800">DHCP</text>
  <rect x="260" y="392" width="120" height="44" rx="22" class="field"/><text x="292" y="420" fill="#cbd5e1" font-size="17">PPPoE</text>
  <rect x="396" y="392" width="120" height="44" rx="22" class="field"/><text x="434" y="420" fill="#cbd5e1" font-size="17">Fixo</text>
  <text x="124" y="492" class="small">DNS 1 · DNS 2 · DNS 3</text>
  <rect x="124" y="512" width="390" height="46" rx="14" class="field"/><text x="148" y="542" fill="#e5e7eb" font-size="18">1.1.1.1 · 8.8.8.8 · opcional</text>

  <rect x="674" y="172" width="520" height="454" rx="30" class="card"/>
  <text x="712" y="228" class="label">SQM / CAKE</text>
  <text x="712" y="274" class="small">WAN1 upload</text><text x="1002" y="280" class="num">12500</text><text x="1120" y="280" class="small">kbps</text>
  <rect x="712" y="304" width="390" height="12" rx="6" fill="#26334d"/><rect x="712" y="304" width="220" height="12" rx="6" fill="url(#g)"/>
  <text x="712" y="370" class="small">Visitantes download</text><text x="1002" y="376" class="num">0</text><text x="1040" y="376" class="small">ilimitado</text>
  <rect x="712" y="400" width="390" height="12" rx="6" fill="#26334d"/>
  <text x="712" y="466" class="small">Visitantes upload</text><text x="1002" y="472" class="num">1500</text><text x="1110" y="472" class="small">kbps</text>
  <rect x="712" y="496" width="390" height="12" rx="6" fill="#26334d"/><rect x="712" y="496" width="86" height="12" rx="6" fill="#22c55e"/>
  <rect x="890" y="548" width="212" height="52" rx="26" class="btn"/><text x="944" y="581" fill="#fff" font-size="18" font-weight="800">Salvar</text>
</svg>
