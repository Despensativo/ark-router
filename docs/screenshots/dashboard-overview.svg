<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="ARK Router dashboard overview preview">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      .bg{fill:url(#bg)}
      .card{fill:#172033;stroke:#26334d;stroke-width:1.5;filter:url(#shadow)}
      .muted{fill:#94a3b8;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px}
      .label{fill:#cbd5e1;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:600}
      .title{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:800}
      .big{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:44px;font-weight:800}
      .small{fill:#94a3b8;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px}
      .ok{fill:#22c55e}.warn{fill:#f59e0b}.blue{fill:#38bdf8}.purple{fill:#8b5cf6}
    </style>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <rect x="44" y="42" width="1192" height="676" rx="34" fill="#0b1120" stroke="#1e293b"/>
  <text x="86" y="104" class="title">ARK Router</text>
  <text x="86" y="140" class="muted">OpenWrt operational dashboard · Multi-WAN · SQM · Wi‑Fi · Devices</text>
  <rect x="950" y="72" width="220" height="48" rx="24" fill="url(#accent)"/>
  <text x="993" y="104" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Ark - Setup</text>

  <rect class="card" x="86" y="176" width="340" height="128" rx="24"/>
  <text x="116" y="220" class="label">Download agora</text>
  <text x="116" y="272" class="big">138 Mbps</text>
  <circle cx="374" cy="238" r="34" class="blue" opacity=".22"/>
  <path d="M374 214v44m0 0-16-16m16 16 16-16" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <rect class="card" x="470" y="176" width="340" height="128" rx="24"/>
  <text x="500" y="220" class="label">Upload agora</text>
  <text x="500" y="272" class="big">18 Mbps</text>
  <circle cx="758" cy="238" r="34" class="purple" opacity=".24"/>
  <path d="M758 262v-44m0 0-16 16m16-16 16 16" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <rect class="card" x="854" y="176" width="316" height="128" rx="24"/>
  <text x="884" y="220" class="label">Saúde do roteador</text>
  <text x="884" y="263" class="small">CPU 18% · RAM 42% · Disco 41%</text>
  <rect x="884" y="276" width="236" height="10" rx="5" fill="#26334d"/>
  <rect x="884" y="276" width="98" height="10" rx="5" fill="url(#accent)"/>

  <rect class="card" x="86" y="340" width="532" height="164" rx="26"/>
  <text x="116" y="386" class="label">WAN 1</text>
  <circle cx="202" cy="378" r="9" class="ok"/>
  <text x="116" y="426" class="muted">DHCP · online · gateway ativo</text>
  <text x="116" y="468" class="small">Editar DHCP, PPPoE, IP fixo e DNS sem sair do painel.</text>
  <rect x="474" y="374" width="104" height="42" rx="21" fill="#1e293b" stroke="#334155"/>
  <text x="505" y="401" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Editar</text>

  <rect class="card" x="638" y="340" width="532" height="164" rx="26"/>
  <text x="668" y="386" class="label">WAN 2 / LAN</text>
  <circle cx="806" cy="378" r="9" class="warn"/>
  <text x="668" y="426" class="muted">LAN1 preparada para segundo link</text>
  <text x="668" y="468" class="small">Alternar WAN2 em LAN1/LAN2/LAN3 ou devolver porta para LAN.</text>
  <rect x="1026" y="374" width="104" height="42" rx="21" fill="#1e293b" stroke="#334155"/>
  <text x="1057" y="401" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Editar</text>

  <rect class="card" x="86" y="540" width="1084" height="112" rx="26"/>
  <text x="116" y="586" class="label">Dispositivos conectados</text>
  <text x="116" y="625" class="muted">Renomear · reservar IP · priorizar · visualizar tráfego por cliente</text>
  <circle cx="1004" cy="596" r="20" fill="#1d4ed8"/><circle cx="1052" cy="596" r="20" fill="#7c3aed"/><circle cx="1100" cy="596" r="20" fill="#059669"/>
</svg>
